services:

  # ─────────────────────────────────────────
  # SQL Server 2022
  # ─────────────────────────────────────────
  planify-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: planify-db
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - planify-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -Q \"SELECT 1\" -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Planify API
  # ─────────────────────────────────────────
  planify-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planify-api
    ports:
      - "8080:8080"
    environment:
      # ASP.NET Core
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # Database — trỏ vào service planify-db
      ConnectionStrings__DefaultConnection: "Server=planify-db,1433;Database=PlanifyDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

      # JWT
      JwtSettings__Key: ${JWT_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      JwtSettings__ExpireMinutes: ${JWT_EXPIRE_MINUTES}

      # Google OAuth
      GoogleSettings__ClientId: ${GOOGLE_CLIENT_ID}

      # OpenAI
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: ${OPENAI_MODEL}

      # Email (SMTP)
      EmailSettings__SmtpServer: smtp.gmail.com
      EmailSettings__SmtpPort: 587
      EmailSettings__SenderName: "Planify System"
      EmailSettings__SenderEmail: ${EMAIL_SENDER}
      EmailSettings__Password: ${EMAIL_PASSWORD}

      # CORS
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:5173"
      Cors__AllowedOrigins__2: "http://localhost:4200"

    depends_on:
      planify-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  planify-db-data:
